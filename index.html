<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#faf8f6">
<title>聊聊你</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:#1f2430;background:#faf8f6;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 16% 10%, rgba(255,206,206,.65), transparent 68%),
    radial-gradient(42% 34% at 86% 18%, rgba(203,212,255,.62), transparent 70%),
    radial-gradient(46% 36% at 72% 92%, rgba(255,232,196,.62), transparent 72%);
  filter:blur(6px);
}
.screen{
  position:fixed;inset:0;z-index:1;
  padding:26px 22px;
  padding-top:calc(26px + env(safe-area-inset-top));
  padding-bottom:calc(26px + env(safe-area-inset-bottom));
  display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.screen.on{display:flex}
.wrap{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;justify-content:center;min-height:100%}

/* ---------- 封面 ---------- */
.eyebrow{
  font-size:12px;letter-spacing:2.4px;color:#a8aec0;text-transform:uppercase;
  margin-bottom:18px;font-weight:500;
}
h1{
  font-size:34px;font-weight:600;margin:0 0 18px;letter-spacing:1.5px;line-height:1.3;
  background:linear-gradient(135deg,#3b4260,#7a6cff 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lede{font-size:15px;line-height:1.9;color:#6a7186;margin:0 0 40px;font-weight:400}
.lede em{font-style:normal;color:#8a90a6}

.btn{
  display:block;width:100%;border:0;border-radius:999px;
  padding:17px 24px;font-size:16.5px;font-weight:500;color:#fff;letter-spacing:1px;
  background:linear-gradient(120deg,#7286ff,#9a6bff 55%,#c07cf0);
  box-shadow:0 14px 28px -10px rgba(122,108,255,.7);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s,opacity .2s;
  font-family:inherit;cursor:pointer;
}
.btn:active{transform:scale(.975);box-shadow:0 8px 18px -8px rgba(122,108,255,.6)}

/* ---------- 答题 ---------- */
.head{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.track{flex:1;height:3px;border-radius:3px;background:rgba(31,36,48,.08);overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#7286ff,#b06bff);transition:width .45s cubic-bezier(.2,.8,.3,1)}
.count{font-size:12.5px;color:#9aa0b4;font-variant-numeric:tabular-nums;letter-spacing:.5px;min-width:42px;text-align:right}

.chip{
  align-self:flex-start;font-size:12px;font-weight:500;letter-spacing:.5px;
  color:#7c6bd8;background:rgba(124,107,216,.10);
  padding:6px 13px;border-radius:999px;margin-bottom:18px;
}
.qbox{animation:rise .42s cubic-bezier(.22,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q{font-size:21px;line-height:1.72;font-weight:500;margin:0 0 26px;letter-spacing:.3px;color:#20263a}

textarea{
  width:100%;border:0;border-radius:20px;padding:18px 19px;
  font-size:16px;line-height:1.75;color:#1f2430;font-family:inherit;
  background:rgba(255,255,255,.82);
  box-shadow:0 0 0 1.5px rgba(31,36,48,.06), 0 12px 30px -22px rgba(40,50,90,.55);
  resize:none;outline:none;min-height:112px;
  transition:box-shadow .22s,background .22s;
}
textarea:focus{background:#fff;box-shadow:0 0 0 2px rgba(122,108,255,.42), 0 14px 34px -20px rgba(122,108,255,.5)}
textarea::placeholder{color:#b9bece}

.foot{margin-top:22px}
.hint{height:20px;margin-top:12px;font-size:13px;color:#c25f6a;text-align:center;opacity:0;transition:opacity .2s}
.hint.on{opacity:1}

/* ---------- 结束 ---------- */
.finish{align-items:center;text-align:center}
.dot{
  width:72px;height:72px;border-radius:50%;margin-bottom:26px;
  background:linear-gradient(135deg,#7286ff,#b06bff);
  box-shadow:0 16px 34px -14px rgba(122,108,255,.75);
  display:flex;align-items:center;justify-content:center;
  animation:pop .5s cubic-bezier(.2,1.3,.4,1);
}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.dot svg{width:34px;height:34px}
.thanks{font-size:23px;font-weight:600;letter-spacing:2px;color:#2b3044;margin-bottom:10px}
.thanks-sub{font-size:14px;color:#9aa0b4;letter-spacing:.5px}
</style>
</head>
<body>

<section class="screen on" id="s-intro">
  <div class="wrap">
    <div class="eyebrow">20 Questions</div>
    <h1>聊聊你</h1>
    <p class="lede">没有标准答案，也不用讲究措辞。<br><em>想到什么写什么就好。</em></p>
    <button class="btn" id="startBtn">开始</button>
  </div>
</section>

<section class="screen" id="s-quiz">
  <div class="wrap">
    <div class="head">
      <div class="track"><i class="fill" id="fill"></i></div>
      <div class="count" id="count">1 / 20</div>
    </div>
    <div class="chip" id="chip" style="display:none"></div>
    <div class="qbox" id="qbox">
      <div class="q" id="q"></div>
      <textarea id="box" rows="3" placeholder="在这里写…" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div class="foot"><button class="btn" id="nextBtn">下一题</button></div>
    <div class="hint" id="hint">随便写两句就行</div>
  </div>
</section>

<section class="screen" id="s-done">
  <div class="wrap finish">
    <div class="dot">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <div class="thanks">谢谢</div>
    <div class="thanks-sub" id="doneSub">都答完了，可以关掉了</div>
  </div>
</section>

<script>
var NTFY_URL = "https://ntfy.sh/dsh58c91088a522794754df4191";
var TITLE_B64 = "6Zeu562U6K6w5b2V";
var QUESTIONS = [{"key": "q01", "text": "周末通常是睡到自然醒，还是会早早起来？", "sec": ""}, {"key": "q02", "text": "休息的时候，你更想出门走走，还是待在家里？", "sec": ""}, {"key": "q03", "text": "最近一次觉得「今天过得还不错」，是因为什么？", "sec": ""}, {"key": "q04", "text": "有没有一部反复看也不腻的剧或者电影？", "sec": ""}, {"key": "q05", "text": "吃饭这件事上，你是「固定那几家」，还是「总想试试新的」？", "sec": ""}, {"key": "q06", "text": "如果凭空多出一个完全空着的下午，你会怎么用？", "sec": ""}, {"key": "q07", "text": "有没有一直想学、但还没开始的事情？", "sec": ""}, {"key": "q08", "text": "手机相册里，你最多的是哪一类照片？", "sec": ""}, {"key": "q09", "text": "遇到不太熟的人，你一般是先观察，还是先开口？", "sec": "再聊细一点"}, {"key": "q10", "text": "你身上有什么特点，容易被别人误会、其实并不是那样？", "sec": "再聊细一点"}, {"key": "q11", "text": "心情不太好的时候，你一般找人说说，还是自己待一会儿？", "sec": "再聊细一点"}, {"key": "q12", "text": "别人夸你哪一句，你会真的往心里去？", "sec": "再聊细一点"}, {"key": "q13", "text": "有没有一直想改掉、但总也改不掉的毛病？", "sec": "再聊细一点"}, {"key": "q14", "text": "你觉得自己这几年，最大的变化是什么？", "sec": "再聊细一点"}, {"key": "q15", "text": "身边的朋友通常会怎么形容你？", "sec": "最后几个，可能要想一想"}, {"key": "q16", "text": "你身边有没有一个人，对你的影响比你以为的还要大？", "sec": "最后几个，可能要想一想"}, {"key": "q17", "text": "有没有一件当时没做、后来偶尔还会想起来的事？", "sec": "最后几个，可能要想一想"}, {"key": "q18", "text": "上一次你为一件事投入很久，是什么时候、为了什么？", "sec": "最后几个，可能要想一想"}, {"key": "q19", "text": "如果现在能给三年前的自己留一句话，你会说什么？", "sec": "最后几个，可能要想一想"}, {"key": "q20", "text": "接下来一年，你最想给自己留下的是什么？", "sec": "最后几个，可能要想一想"}];

var idx = 0, answers = [];

function $(id){ return document.getElementById(id); }
function show(id){
  var ss = document.querySelectorAll('.screen');
  for (var i=0;i<ss.length;i++) ss[i].className = 'screen';
  $(id).className = 'screen on';
}

function render(){
  var q = QUESTIONS[idx];
  $('count').textContent = (idx+1) + ' / ' + QUESTIONS.length;
  $('fill').style.width = ((idx)/QUESTIONS.length*100) + '%';
  if (q.sec && (!idx || QUESTIONS[idx-1].sec !== q.sec)) {
    $('chip').textContent = q.sec;
    $('chip').style.display = 'block';
  } else {
    $('chip').style.display = 'none';
  }
  $('q').textContent = q.text;
  var box = $('box');
  box.value = answers[idx] || '';
  $('nextBtn').textContent = (idx === QUESTIONS.length-1) ? '写完啦' : '下一题';
  $('hint').className = 'hint';
  var qb = $('qbox');
  qb.style.animation = 'none'; void qb.offsetWidth; qb.style.animation = '';
  setTimeout(function(){ try{ box.focus(); }catch(e){} }, 180);
}

function next(){
  var v = $('box').value.replace(/^\s+|\s+$/g,'');
  if (!v) { $('hint').className = 'hint on'; return; }
  answers[idx] = v;
  if (idx < QUESTIONS.length-1) { idx++; render(); }
  else { finish(); }
}

function fmt(d){
  function p(n){ return n<10?'0'+n:''+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function buildText(){
  var L = [];
  L.push('============================================');
  L.push(' 问答记录   ' + fmt(new Date()));
  L.push('============================================');
  for (var i=0;i<QUESTIONS.length;i++){
    L.push('');
    L.push('[' + (i+1) + '] ' + QUESTIONS[i].text);
    L.push('     ' + (answers[i] || ''));
  }
  L.push('');
  L.push('共 ' + QUESTIONS.length + ' 题');
  return L.join('\n');
}
function bytes(s){ try { return new Blob([s]).size; } catch(e){ return s.length*3; } }
function split3k(text){
  var out=[], cur=[], size=0, lines=text.split('\n');
  for (var i=0;i<lines.length;i++){
    var l = lines[i] + '\n', b = bytes(l);
    if (size>0 && size+b>3000){ out.push(cur.join('')); cur=[]; size=0; }
    cur.push(l); size+=b;
  }
  if (cur.length) out.push(cur.join(''));
  return out;
}
function post(body, part, total){
  return new Promise(function(resolve){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', NTFY_URL, true);
    xhr.setRequestHeader('Title', '=?UTF-8?B?' + TITLE_B64 + '?=' + (total>1 ? ' ('+part+'/'+total+')' : ''));
    xhr.setRequestHeader('Tags', 'memo');
    xhr.timeout = 20000;
    xhr.onload = function(){ resolve(xhr.status>=200 && xhr.status<300); };
    xhr.onerror = function(){ resolve(false); };
    xhr.ontimeout = function(){ resolve(false); };
    try { xhr.send(body); } catch(e){ resolve(false); }
  });
}
function push(text){
  var parts = split3k(text), chain = Promise.resolve(true);
  for (var i=0;i<parts.length;i++){
    (function(p, body){
      chain = chain.then(function(ok){ return ok ? post(body, p+1, parts.length) : false; });
    })(i, parts[i]);
  }
  return chain;
}
function savePending(t){ try{ localStorage.setItem('qa_pending', t); }catch(e){} }
function loadPending(){ try{ return localStorage.getItem('qa_pending'); }catch(e){ return null; } }
function clearPending(){ try{ localStorage.removeItem('qa_pending'); }catch(e){} }

function finish(){
  show('s-done');
  var text = buildText();
  savePending(text);
  push(text).then(function(ok){ if (ok) clearPending(); });
}

$('startBtn').onclick = function(){ show('s-quiz'); idx = 0; render(); };
$('nextBtn').onclick = next;
$('box').addEventListener('keydown', function(e){
  if (e.keyCode === 13 && (e.ctrlKey || e.metaKey)) { e.preventDefault(); next(); }
});

(function(){
  var p = loadPending();
  if (!p) return;
  push(p).then(function(ok){ if (ok) clearPending(); });
})();
</script>
</body>
</html>
