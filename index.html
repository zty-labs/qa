<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#dfe7f2">
<title>聊聊你</title>
<style>
:root{color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:#1f2430;background:#dfe7f2;overflow:hidden;-webkit-font-smoothing:antialiased;
}
.fixed-bg{position:fixed;inset:0;z-index:0;background:#dfe7f2 url(bg.jpg) center 34% / cover no-repeat}
.fixed-bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.16) 60%,rgba(255,255,255,.42))}

.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;justify-content:flex-start;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.screen.on{display:flex}

.sheet{
  width:100%;max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);
  backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid rgba(255,255,255,.92);
  border-radius:30px;padding:24px 22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 16px 50px -22px rgba(28,40,80,.38);
  animation:in .45s cubic-bezier(.22,.8,.3,1);
}
@keyframes in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ---------- 封面 ---------- */
.eyebrow{font-size:10.5px;letter-spacing:3px;color:#a6adc2;font-weight:600;margin-bottom:16px}
h1{font-size:30px;font-weight:600;margin:0 0 14px;letter-spacing:1.6px;line-height:1.3;
  background:linear-gradient(115deg,#2b3145,#7a6cff 82%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:14px;line-height:1.9;color:#6d7488;margin:0 0 24px}
.lede em{font-style:normal;color:#a0a6bb}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:0;border-radius:999px;padding:12px 24px;
  font-size:14.5px;font-weight:500;color:#fff;letter-spacing:.8px;
  background:linear-gradient(120deg,#7b8cff,#a86bff);
  box-shadow:0 12px 24px -14px rgba(122,108,255,.9);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s;
  font-family:inherit;cursor:pointer;
}
.btn:active{transform:scale(.96);box-shadow:0 5px 14px -10px rgba(122,108,255,.85)}
.btn .arw{font-size:13px;opacity:.9;transform:translateY(.5px)}
.row{margin-top:20px;text-align:right}

/* ---------- 答题 ---------- */
.head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.segs{display:flex;gap:5px;flex:1}
.seg{height:3px;border-radius:2px;background:rgba(31,36,48,.10);flex:1;transition:background .4s ease}
.seg.on{background:linear-gradient(90deg,#7b8cff,#b06bff)}
.count{font-size:11.5px;color:#a2a8bc;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

.sec{font-size:10.5px;letter-spacing:1.4px;color:#7f86ff;font-weight:600;margin:18px 0 8px}
.qbox{animation:rise .38s cubic-bezier(.22,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{font-size:19px;line-height:1.72;font-weight:500;margin:0 0 16px;color:#20263a;letter-spacing:.2px}
.qbox.nosec .q{margin-top:20px}

textarea{width:100%;border:0;border-radius:16px;padding:14px 15px;
  font-size:15.5px;line-height:1.72;color:#1f2430;-webkit-text-fill-color:#1f2430;font-family:inherit;
  background:#f4f6fb;resize:none;outline:none;min-height:92px;
  box-shadow:inset 0 0 0 1.5px rgba(31,36,48,.045);
  transition:box-shadow .2s,background .2s}
textarea:focus{-webkit-text-fill-color:#1f2430;background:#fff;box-shadow:0 0 0 2px rgba(122,108,255,.40)}
textarea::placeholder{color:#b6bccd}

.hint{height:16px;font-size:12px;color:#c9707a;text-align:right;opacity:0;transition:opacity .2s}
.hint.on{opacity:1}

/* ---------- 结束 ---------- */
.finish{text-align:center;padding:36px 22px 40px}
.dot{width:56px;height:56px;border-radius:50%;margin:0 auto 20px;
  background:linear-gradient(135deg,#7b8cff,#b06bff);
  box-shadow:0 12px 26px -12px rgba(122,108,255,.85);
  display:flex;align-items:center;justify-content:center;
  animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.dot svg{width:26px;height:26px}
.thanks{font-size:21px;font-weight:600;letter-spacing:2px;color:#2b3044;margin-bottom:8px}
.thanks-sub{font-size:13px;color:#a0a6bb;letter-spacing:.4px}
</style>
</head>
<body>
<div class="fixed-bg"></div>

<section class="screen on" id="s-intro">
  <div class="sheet">
    <div class="eyebrow" id="eyebrow">10 QUESTIONS</div>
    <h1>聊聊你</h1>
    <p class="lede">没有标准答案，也不用斟酌措辞。<br><em>想到什么写什么就好。</em></p>
    <button class="btn" id="startBtn">开始 <span class="arw">→</span></button>
  </div>
</section>

<section class="screen" id="s-quiz">
  <div class="sheet">
    <div class="head">
      <div class="segs" id="segs"></div>
      <div class="count" id="count">1/10</div>
    </div>
    <div class="sec" id="sec" style="display:none"></div>
    <div class="qbox" id="qbox">
      <div class="q" id="q"></div>
      <textarea id="box" rows="3" placeholder="在这里写…" autocomplete="off" autocorrect="off"></textarea>
      <div class="hint" id="hint">随便写两句就行</div>
      <div class="row"><button class="btn" id="nextBtn">下一题 <span class="arw">→</span></button></div>
    </div>
  </div>
</section>

<section class="screen" id="s-done">
  <div class="sheet finish">
    <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <div class="thanks">谢谢</div>
    <div class="thanks-sub">都答完了，可以关掉了</div>
  </div>
</section>

<script>
var NTFY_URL = "https://ntfy.sh/dsh58c91088a522794754df4191";
var TITLE_B64 = "6Zeu562U6K6w5b2V";
var QUESTIONS = [{"key": "q01", "text": "早上醒来的第一件事，你一般会做什么？", "sec": ""}, {"key": "q02", "text": "最近一次由衷地笑，是在什么场景下？", "sec": ""}, {"key": "q03", "text": "有哪件小事，能让你一下子就放松下来？", "sec": ""}, {"key": "q04", "text": "你更喜欢把一切安排好，还是走到哪算哪？", "sec": ""}, {"key": "q05", "text": "你身上有什么习惯，是被身边人说过很多次的？", "sec": "再往里一点"}, {"key": "q06", "text": "心里有事的时候，你更愿意说出来，还是自己消化？", "sec": "再往里一点"}, {"key": "q07", "text": "你觉得自己是被理解得多，还是被误会得多？", "sec": "再往里一点"}, {"key": "q08", "text": "有没有一个人，你在对方身边不用装样子？", "sec": "再往里一点"}, {"key": "q09", "text": "有什么事情你一直想做，却总没开始？", "sec": "最后两个"}, {"key": "q10", "text": "如果可以对一年前的自己说一句话，你会说什么？", "sec": "最后两个"}];

var idx = 0, answers = [];
function $(id){ return document.getElementById(id); }
function show(id){
  var ss = document.querySelectorAll('.screen');
  for (var i=0;i<ss.length;i++) ss[i].className = 'screen';
  $(id).className = 'screen on';
}
function rebuildSegs(){
  var c = $('segs'); c.innerHTML = '';
  for (var i=0;i<QUESTIONS.length;i++){ var d=document.createElement('i'); d.className='seg'; c.appendChild(d); }
}
rebuildSegs();
function loadQ(){
  return new Promise(function(resolve){
    try{
      var x = new XMLHttpRequest();
      x.open('GET','questions.json?t='+new Date().getTime(),true);
      x.timeout = 4000;
      x.onload = function(){
        try{ var d = JSON.parse(x.responseText); if (d && d.questions && d.questions.length) resolve(d.questions); else resolve(null); }
        catch(e){ resolve(null); }
      };
      x.onerror = function(){ resolve(null); };
      x.ontimeout = function(){ resolve(null); };
      x.send();
    }catch(e){ resolve(null); }
  });
}
var qp = loadQ();
qp.then(function(list){
  if (!list || !list.length) return;
  $('eyebrow').textContent = list.length + ' QUESTIONS';
  $('count').textContent = '1/' + list.length;
});
function render(){
  var q = QUESTIONS[idx];
  $('count').textContent = (idx+1) + '/' + QUESTIONS.length;
  var segs = $('segs').childNodes;
  for (var i=0;i<segs.length;i++) segs[i].className = (i <= idx) ? 'seg on' : 'seg';
  var hasSec = !!q.sec && (idx===0 || QUESTIONS[idx-1].sec !== q.sec);
  if (hasSec) { $('sec').textContent = q.sec; $('sec').style.display = 'block'; }
  else { $('sec').style.display = 'none'; }
  $('qbox').className = 'qbox' + (hasSec ? '' : ' nosec');
  $('q').textContent = q.text;
  var box = $('box');
  box.value = answers[idx] || '';
  $('nextBtn').innerHTML = (idx === QUESTIONS.length-1 ? '写完啦' : '下一题') + ' <span class="arw">→</span>';
  $('hint').className = 'hint';
  var qb = $('qbox'); qb.style.animation = 'none'; void qb.offsetWidth; qb.style.animation = '';
  setTimeout(function(){ try{ box.focus(); }catch(e){} }, 220);
}
function next(){
  var v = $('box').value.replace(/^\s+|\s+$/g,'');
  if (!v) { $('hint').className = 'hint on'; return; }
  answers[idx] = v;
  if (idx < QUESTIONS.length-1) { idx++; render(); } else { finish(); }
}
function fmt(d){ function p(n){ return n<10?'0'+n:''+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function buildText(){
  var L=['============================================',' 问答记录   '+fmt(new Date()),'============================================'];
  for (var i=0;i<QUESTIONS.length;i++){
    L.push(''); L.push('['+(i+1)+'] '+QUESTIONS[i].text); L.push('     '+(answers[i]||''));
  }
  L.push(''); L.push('共 '+QUESTIONS.length+' 题');
  return L.join('\n');
}
function bytes(s){ try{ return new Blob([s]).size; } catch(e){ return s.length*3; } }
function split3k(t){
  var out=[],cur=[],size=0,lines=t.split('\n');
  for (var i=0;i<lines.length;i++){
    var l=lines[i]+'\n', b=bytes(l);
    if (size>0 && size+b>3000){ out.push(cur.join('')); cur=[]; size=0; }
    cur.push(l); size+=b;
  }
  if (cur.length) out.push(cur.join(''));
  return out;
}
function post(body, part, total){
  return new Promise(function(resolve){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', NTFY_URL, true);
    xhr.setRequestHeader('Title', '=?UTF-8?B?' + TITLE_B64 + '?=' + (total>1 ? ' ('+part+'/'+total+')' : ''));
    xhr.setRequestHeader('Tags','memo');
    xhr.timeout = 20000;
    xhr.onload = function(){ resolve(xhr.status>=200 && xhr.status<300); };
    xhr.onerror = function(){ resolve(false); };
    xhr.ontimeout = function(){ resolve(false); };
    try{ xhr.send(body); }catch(e){ resolve(false); }
  });
}
function push(text){
  var parts=split3k(text), chain=Promise.resolve(true);
  for (var i=0;i<parts.length;i++){
    (function(p,body){ chain = chain.then(function(ok){ return ok ? post(body,p+1,parts.length) : false; }); })(i,parts[i]);
  }
  return chain;
}
function savePending(t){ try{ localStorage.setItem('qa_pending',t); }catch(e){} }
function loadPending(){ try{ return localStorage.getItem('qa_pending'); }catch(e){ return null; } }
function clearPending(){ try{ localStorage.removeItem('qa_pending'); }catch(e){} }
function finish(){
  show('s-done');
  var text = buildText();
  savePending(text);
  push(text).then(function(ok){ if (ok) clearPending(); });
}
$('startBtn').onclick = function(){ show('s-quiz'); idx=0; render(); };
if (qp) qp.then(function(list){
  if (!list || !list.length) return;
  if (idx===0 && !answers.length && !$('box').value){
    QUESTIONS = list; rebuildSegs();
    if ($('s-quiz').className.indexOf('on')>-1) render();
  }
});
$('nextBtn').onclick = next;
$('box').addEventListener('keydown', function(e){
  if (e.keyCode===13 && (e.ctrlKey||e.metaKey)){ e.preventDefault(); next(); }
});
(function(){ var p = loadPending(); if (!p) return; push(p).then(function(ok){ if (ok) clearPending(); }); })();
</script>
</body>
</html>
