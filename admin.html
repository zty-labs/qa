<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>题目后台</title>
<style>
:root{color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  color:#1f2430;background:#dfe7f2;-webkit-font-smoothing:antialiased}
.fixed-bg{position:fixed;inset:0;z-index:0;background:#dfe7f2 url(bg.jpg) center 34% / cover no-repeat}
.fixed-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.42))}
.wrap{position:relative;z-index:1;padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.92);border-radius:28px;
  padding:22px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 16px 50px -22px rgba(28,40,80,.38)}
.eyebrow{font-size:10.5px;letter-spacing:3px;color:#a6adc2;font-weight:600;margin-bottom:12px}
h1{font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:1.2px;
  background:linear-gradient(115deg,#2b3145,#7a6cff 82%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;color:#8b92a6;margin:0 0 20px;line-height:1.7}
label{display:block;font-size:12px;color:#9aa0b4;letter-spacing:.4px;margin:0 0 7px}
input,textarea{width:100%;border:0;border-radius:14px;padding:13px 14px;font-size:15px;font-family:inherit;
  color:#1f2430;-webkit-text-fill-color:#1f2430;background:#f4f6fb;outline:none;box-shadow:inset 0 0 0 1.5px rgba(31,36,48,.045);
  transition:box-shadow .2s,background .2s}
input:focus,textarea:focus{-webkit-text-fill-color:#1f2430;background:#fff;box-shadow:0 0 0 2px rgba(122,108,255,.40)}
textarea{min-height:300px;line-height:1.85;resize:vertical;font-size:14.5px}
.mt{margin-top:18px}
.tip{font-size:11.5px;color:#a7adc0;line-height:1.7;margin-top:8px}
.tip code{background:#eef1f8;border-radius:4px;padding:1px 5px;font-size:11px;color:#7a6cff}
.btns{display:flex;gap:10px;margin-top:20px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:12px 24px;
  font-size:14.5px;font-weight:500;color:#fff;letter-spacing:.8px;font-family:inherit;cursor:pointer;
  background:linear-gradient(120deg,#7b8cff,#a86bff);box-shadow:0 12px 24px -14px rgba(122,108,255,.9);
  transition:transform .16s,box-shadow .16s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#eef1f8;color:#5b6280;box-shadow:none}
.btn:disabled{opacity:.55;transform:none}
.status{font-size:12.5px;margin-top:14px;min-height:18px;line-height:1.6}
.status.ok{color:#2f9e6b}.status.err{color:#c25f6a}.status.run{color:#8b92a6}
.count{font-size:12px;color:#a2a8bc;margin-top:8px}
.link{display:inline-block;margin-top:16px;font-size:12.5px;color:#7a6cff;text-decoration:none}
</style>
</head>
<body>
<div class="fixed-bg"></div>
<div class="wrap">
  <div class="card">
    <div class="eyebrow">ADMIN</div>
    <h1>题目后台</h1>
    <p class="sub">改完点保存，线上页面约 1 分钟后生效。发给对方的是答题页，不是这个页面。</p>

    <label>GitHub 令牌（只存在你本机）</label>
    <input id="token" type="password" placeholder="ghp_..." autocomplete="off" autocapitalize="off" spellcheck="false">

    <div class="mt">
      <label>题目（一行一题，<code>#</code> 开头的行是小标题）</label>
      <textarea id="area" spellcheck="false" autocapitalize="off" placeholder="# 第一段
第一题
第二题
# 第二段
第三题"></textarea>
      <div class="count" id="cnt">共 0 题</div>
    </div>

    <div class="btns">
      <button class="btn" id="save">保存并发布</button>
      <button class="btn ghost" id="reload">从线上重新载入</button>
    </div>
    <div class="status" id="st"></div>
    <a class="link" href="https://github.com/zty-labs/qa/edit/main/questions.json" target="_blank">或在 GitHub 网页上直接改</a>
    <div class="tip">令牌丢了或者过期，可以在 GitHub 的 Settings → Developer settings → Personal access tokens 重新生成一个，勾上 <code>repo</code> 权限。</div>
  </div>
</div>
<script>
var OWNER='zty-labs', REPO='qa', PATH='questions.json';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+PATH;
var area=document.getElementById('area'), st=document.getElementById('st'), cnt=document.getElementById('cnt');
var tok=document.getElementById('token');

tok.value = localStorage.getItem('gh_token') || '';

function status(msg, cls){ st.className='status ' + (cls||''); st.textContent = msg; }
function b64(str){
  var bytes = new TextEncoder().encode(str), bin='';
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function parse(txt){
  var qs=[], sec='';
  var lines = txt.split('\n');
  for (var i=0;i<lines.length;i++){
    var l = lines[i].replace(/^\s+|\s+$/g,'');
    if (!l) continue;
    if (l.charAt(0)==='#'){ sec = l.replace(/^#+\s*/,''); continue; }
    var item = {text:l};
    if (sec) item.sec = sec;
    qs.push(item); sec='';
  }
  return qs;
}
function toText(data){
  var out=[];
  for (var i=0;i<data.length;i++){
    if (data[i].sec) out.push('# ' + data[i].sec);
    out.push(data[i].text);
  }
  return out.join('\n');
}
function updateCount(){
  var n = parse(area.value).length;
  cnt.textContent = '共 ' + n + ' 题';
}
area.addEventListener('input', updateCount);

function loadRemote(){
  status('正在读取线上题目…','run');
  fetch('questions.json?t='+new Date().getTime())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.questions || !d.questions.length) { status('线上还没有题目','err'); return; }
      area.value = toText(d.questions);
      updateCount();
      status('已载入线上 ' + d.questions.length + ' 题','ok');
    })
    .catch(function(){ status('读取失败，检查一下网络','err'); });
}

function save(){
  var t = tok.value.replace(/^\s+|\s+$/g,'');
  if (!t) { status('先填 GitHub 令牌','err'); return; }
  var qs = parse(area.value);
  if (!qs.length) { status('至少要有一道题','err'); return; }
  localStorage.setItem('gh_token', t);
  var btn = document.getElementById('save'); btn.disabled = true;
  status('正在保存…','run');
  var headers = {'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  fetch(API, {headers:headers})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(info){
      var body = {message:'update questions', content:b64(JSON.stringify({questions:qs}, null, 1))};
      if (info && info.sha) body.sha = info.sha;
      return fetch(API, {method:'PUT', headers:headers, body:JSON.stringify(body)});
    })
    .then(function(r){
      if (r.ok) { status('发布成功，共 ' + qs.length + ' 题 · 约 1 分钟后生效','ok'); }
      else if (r.status===401 || r.status===403) { status('令牌无效或已过期，换一个再试','err'); }
      else if (r.status===409) { status('冲突了，点「从线上重新载入」再改','err'); }
      else { status('保存失败（' + r.status + '）','err'); }
    })
    .catch(function(){ status('网络错误，没保存成功','err'); })
    .then(function(){ btn.disabled = false; });
}
document.getElementById('save').onclick = save;
document.getElementById('reload').onclick = loadRemote;
updateCount(); loadRemote();
</script>
</body>
</html>
