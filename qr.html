<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>扫码答题</title>
<style>
:root{color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:#dfe7f2;color:#1f2430;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.fixed-bg{position:fixed;inset:0;z-index:0;background:#dfe7f2 url(bg.jpg) center 34% / cover no-repeat}
.fixed-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.40))}
.card{position:relative;z-index:1;width:100%;max-width:420px;text-align:center;
  background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.92);
  border-radius:32px;padding:34px 26px 30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 18px 60px -26px rgba(28,40,80,.42)}
.eyebrow{font-size:10.5px;letter-spacing:3px;color:#a6adc2;font-weight:600;margin-bottom:18px}
.qr{width:min(66vw,260px);height:auto;display:block;margin:0 auto 20px;border-radius:14px;
  background:#fff;box-shadow:0 10px 34px -18px rgba(28,40,80,.45)}
h1{font-size:19px;font-weight:600;letter-spacing:.6px;margin:0 0 10px;color:#242a3c}
.sub{font-size:13px;color:#8b92a6;line-height:1.8;margin:0}
.sub b{font-weight:500;color:#7a6cff}
.url{margin-top:18px;font-size:11px;color:#b3b9c9;letter-spacing:.2px;word-break:break-all}
</style>
</head>
<body>
<div class="fixed-bg"></div>
<div class="card">
  <div class="eyebrow">SCAN TO START</div>
  <img class="qr" src="qr.png" alt="答题二维码">
  <h1>扫一下，回答几个问题</h1>
  <p class="sub">微信扫一扫，或长按图片识别<br>共 <b id="n">10</b> 题，没有标准答案</p>
  <div class="url">zty-labs.github.io/qa/</div>
</div>
<script>
fetch('questions.json?t='+Date.now()).then(function(r){return r.json()}).then(function(d){
  if(d&&d.questions&&d.questions.length) document.getElementById('n').textContent=d.questions.length;
}).catch(function(){});
</script>
</body>
</html>
